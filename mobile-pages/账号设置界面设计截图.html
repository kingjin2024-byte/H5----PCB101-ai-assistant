<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>账号设置｜PCB101</title>
  <link rel="stylesheet" href="./mobile-ui.css">
  <link rel="stylesheet" href="./settings-icons.css">
</head>
<body>
  <main class="mobile-page">
    <header data-mobile-nav data-title="账号设置" data-back="./我的主页界面设计.html"></header>
    <div class="pcb-background"></div>
    <section class="mobile-card settings-list">
      <a class="setting-row" href="#phone"><span class="setting-icon setting-phone" aria-hidden="true"></span><strong>更换手机号码</strong><small>13925234610</small><i class="setting-arrow"></i></a>
      <a class="setting-row" href="#agreement"><span class="setting-icon setting-agreement" aria-hidden="true"></span><strong>用户协议</strong><i class="setting-arrow"></i></a>
      <a class="setting-row" href="#privacy"><span class="setting-icon setting-privacy" aria-hidden="true"></span><strong>隐私政策</strong><i class="setting-arrow"></i></a>
      <a class="setting-row" href="#feedback"><span class="setting-icon setting-feedback" aria-hidden="true"></span><strong>意见反馈</strong><i class="setting-arrow"></i></a>
    </section>
    <button class="outline-button" type="button">退出当前账号</button>
    <div class="settings-footer-circuit" aria-hidden="true"></div>
    <p class="settings-brand"><img src="../assets/pcb101-logo.png" alt="">PCB101 <small>｜ 让PCB人才更值钱</small></p>
    <img class="settings-robot mascot" src="../assets/yaodi-floating.png" alt="幺弟">
  </main>
  <script src="./mobile-ui.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>PCB101 AI求职助手</title>
  <link rel="stylesheet" href="./landing.css" />
  <link rel="stylesheet" href="./landing-overrides.css" />
  <link rel="stylesheet" href="./prototype-pages.css" />
  <link rel="stylesheet" href="./wechat-login.css" />
  <link rel="stylesheet" href="./banner-fit.css" />
  <link rel="stylesheet" href="./banner-composed.css" />
  <link rel="stylesheet" href="./banner-compact.css" />
  <link rel="stylesheet" href="./landing-home-refresh.css" />
</head>
<body data-prototype-page="1">
  <main class="landing-shell">
    <header class="landing-nav">
      <button class="back" type="button" aria-label="返回" onclick="history.back()">‹</button>
      <strong>PCB101 行业第一的 AI 招聘平台</strong>
      <span class="mini-controls" aria-hidden="true"><b>•••</b><i></i></span>
    </header>
    <section class="hero unified-header-banner composed-banner">
      <img class="composed-logo" src="./assets/pcb101-logo.png" alt="PCB101 Logo" />
      <div class="composed-copy"><h1>我是<span>幺弟</span></h1><p>PCB 圈最懂你的</p><strong>招聘小助手</strong></div>
      <img class="composed-robot" src="./assets/yaodi-greeting.png" alt="挥手的幺弟机器人" />
    </section>
    <section class="features" aria-label="产品功能">
      <article><span class="feature-icon chat"><i></i><i></i><i></i></span><div><h2>智能问答</h2><p>快速解答你的求职问题</p></div></article>
      <article><span class="feature-icon target"><i></i></span><div><h2>精准匹配</h2><p>智能推荐高匹配岗位</p></div></article>
      <article><span class="feature-icon chart"><i></i><i></i><i></i><em>✓</em></span><div><h2>进度管理</h2><p>记录进度，助力成长</p></div></article>
    </section>
    <section class="platform-stats" aria-label="平台数据">
      <div><strong>10w+</strong><span>PCB岗位</span></div>
      <div><strong>5w+</strong><span>企业用户</span></div>
      <div><strong>98%</strong><span>匹配精准度</span></div>
    </section>
    <section class="login-area">
      <a id="openWechatLogin" class="login-button" href="#" aria-label="微信登录或注册"><span class="wechat" aria-hidden="true"><i>••</i><b>••</b></span>微信登录 / 注册</a>
      <p><span class="shield">✓</span>登录即表示同意相关<a href="#service">服务协议</a>和<a href="#privacy">隐私政策</a></p>
    </section>
    <section id="wechatLoginModal" class="wechat-login-overlay" role="dialog" aria-modal="true" aria-labelledby="wechatLoginTitle" hidden>
      <div class="wechat-login-dialog">
        <button id="closeWechatLogin" class="wechat-login-close" type="button" aria-label="关闭微信登录">×</button>
        <span class="wechat-login-mark" aria-hidden="true"><i>••</i><b>••</b></span>
        <h2 id="wechatLoginTitle">欢迎登录</h2>
        <p class="wechat-login-intro">使用微信快捷登录，保存求职进度与 AI 对话记录</p>
        <button id="wechatLoginButton" class="wechat-login-submit" type="button">微信一键登录</button>
        <label class="agreement-check"><input id="agreementCheckbox" type="checkbox" /><i></i><span>我已阅读并同意 <a href="#service">《服务协议》</a> 和 <a href="#privacy">《隐私政策》</a></span></label>
        <p class="login-hint" id="loginHint">未注册的微信用户登录后将自动创建 PCB101 账号</p>
      </div>
    </section>
  </main>
  <iframe id="prototypeFrame" class="prototype-frame" title="PCB101 AI 求职助手后续页面" hidden></iframe>
  <script src="./prototype-pages.js"></script>
  <script src="./landing.js?v=top-level-router-20260726"></script>
</body>
</html>
